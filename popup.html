<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      /* Haal width: 400px weg; de zijbalk schaalt nu mee */
      width: 100%;
      min-width: 280px;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 14px;
      margin: 0;
      background: #121214;
      color: #e4e4e7;
      box-sizing: border-box;
    }
    h2 { font-size: 15px; margin: 0 0 12px 0; color: #38bdf8; }
    button {
      width: 100%;
      padding: 10px;
      background: #0284c7;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }
    button:hover { background: #0369a1; }
    button:disabled { background: #3f3f46; cursor: not-allowed; }
    #meta-bar {
      margin-top: 10px;
      font-size: 12px;
      color: #a1a1aa;
      display: flex;
      justify-content: space-between;
      min-height: 16px;
    }
    #output {
      display: none;
      margin-top: 10px;
      max-height: 420px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.6;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 14px;
    }
    #output h1, #output h2, #output h3 {
      color: #38bdf8;
      margin: 14px 0 6px 0;
      font-weight: 600;
    }
    #output h3 { font-size: 14px; }
    #output strong { color: #f4f4f5; }
    #output hr {
      border: none;
      border-top: 1px solid #27272a;
      margin: 12px 0;
    }
    #output li {
      margin-left: 18px;
      margin-bottom: 4px;
    }
    .error-box {
      color: #f87171 !important;
      border-color: #ef444455 !important;
      background: #271416 !important;
    }
  </style>
</head>
<body>
  <h2>Factcheck Tab</h2>
  <button id="checkBtn">Factcheck Deze Pagina</button>
  
  <div id="meta-bar">
    <span id="status"></span>
    <span id="token-info"></span>
  </div>

  <div id="output"></div>

  <script type="module" src="popup.js"></script>
</body>
</html>
